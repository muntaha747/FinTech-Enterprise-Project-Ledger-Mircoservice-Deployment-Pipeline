<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="100%" role="img" aria-label="Pod Anatomy">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="570" rx="22" fill="url(#bg)"/>
<text x="600.0" y="50.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#ttl)" text-anchor="middle">Pod Anatomy</text>
<text x="600.0" y="80.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">What one ledger pod runs: an init check, the app, its health probes and its config</text>
<rect x="30" y="150" width="260" height="150" rx="14" fill="#0b1224" stroke="#ff9f1c" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></rect>
<rect x="30" y="150" width="260" height="34" rx="12" fill="#ff9f1c"/>
<text x="160.0" y="173.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Deployment</text>
<text x="42.0" y="206.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">replicas from values.yaml</text>
<text x="42.0" y="225.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">selector: app label</text>
<text x="42.0" y="244.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">RollingUpdate strategy</text>
<rect x="340" y="130" width="820" height="400" rx="22" fill="#ffffff" fill-opacity="0.04" stroke="#b388ff" stroke-width="3" stroke-dasharray="8 6"/>
<text x="360.0" y="162.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#b388ff" text-anchor="start">Pod  (one of N replicas)</text>
<rect x="370" y="190" width="250" height="140" rx="14" fill="#0b1224" stroke="#ffe600" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="370" y="190" width="250" height="34" rx="12" fill="#ffe600"/>
<text x="495.0" y="213.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">init-mydb (busybox)</text>
<text x="382.0" y="246.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">waits for the MySQL service</text>
<text x="382.0" y="265.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">DNS before the app starts</text>
<rect x="660" y="190" width="470" height="300" rx="14" fill="#0b1224" stroke="#39ff14" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></rect>
<rect x="660" y="190" width="470" height="34" rx="12" fill="#39ff14"/>
<text x="895.0" y="213.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">app container · port 8080</text>
<text x="672.0" y="246.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">image: ledger repo : rel&lt;N&gt;</text>
<text x="672.0" y="265.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">env MYSQL_USER / PASSWORD ← Secret</text>
<text x="672.0" y="284.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">env KUBERNETES_CLUSTER_DOMAIN</text>
<text x="672.0" y="303.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">CPU 100m–400m · memory 128Mi–1Gi</text>
<rect x="680" y="370" width="210" height="100" rx="14" fill="#0b1224" stroke="#ff2d95" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></rect>
<rect x="680" y="370" width="210" height="34" rx="12" fill="#ff2d95"/>
<text x="785.0" y="393.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">liveness</text>
<text x="692.0" y="426.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">/actuator/health/liveness</text>
<text x="692.0" y="445.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">restart pod if it fails</text>
<rect x="910" y="370" width="200" height="100" rx="14" fill="#0b1224" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></rect>
<rect x="910" y="370" width="200" height="34" rx="12" fill="#00e5ff"/>
<text x="1010.0" y="393.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">readiness</text>
<text x="922.0" y="426.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">/actuator/health/readiness</text>
<text x="922.0" y="445.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">out of traffic if it fails</text>
<rect x="370" y="380" width="250" height="100" rx="14" fill="#0b1224" stroke="#b388ff" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></rect>
<rect x="370" y="380" width="250" height="34" rx="12" fill="#b388ff"/>
<text x="495.0" y="403.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">ConfigMap volume</text>
<text x="382.0" y="436.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">application.properties</text>
<text x="382.0" y="455.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">mounted into the app container</text>
<path d="M 290 225 L 340 225" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="340,225 328.0,231.0 328.0,219.0" fill="#ff9f1c"/>
<circle r="5" fill="#ffffff" stroke="#ff9f1c" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 290 225 L 340 225"/></circle>
<path d="M 620 260 L 660 260" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="660,260 648.0,266.0 648.0,254.0" fill="#ffe600"/>
<circle r="5" fill="#ffffff" stroke="#ffe600" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 620 260 L 660 260"/></circle>
<path d="M 620 430 L 660 430" fill="none" stroke="#b388ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="660,430 648.0,436.0 648.0,424.0" fill="#b388ff"/>
<circle r="5" fill="#ffffff" stroke="#b388ff" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 620 430 L 660 430"/></circle>
<text x="600.0" y="548.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ffe600" text-anchor="middle">Probes tell Kubernetes when the pod is alive and when it is ready for traffic.</text>
</svg>
