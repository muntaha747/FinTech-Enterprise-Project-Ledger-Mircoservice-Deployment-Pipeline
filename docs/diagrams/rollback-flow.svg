<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-label="Rollback with Git Revert">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="470" rx="22" fill="url(#bg)"/>
<text x="600.0" y="50.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#ttl)" text-anchor="middle">Rollback with Git Revert</text>
<text x="600.0" y="80.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">A bad release is undone with one commit. No rebuild and no manual cluster edits.</text>
<line x1="120" y1="220" x2="1080" y2="220" stroke="#b388ff" stroke-width="4" stroke-opacity="0.6"/>
<circle cx="180" cy="220" r="22" fill="#0b1224" stroke="#00e5ff" stroke-width="4"><animate attributeName="r" values="22;25;22" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="180.0" y="185.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#00e5ff" text-anchor="middle">rel53</text>
<text x="180.0" y="262.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="middle">good</text>
<circle cx="420" cy="220" r="22" fill="#0b1224" stroke="#00e5ff" stroke-width="4"><animate attributeName="r" values="22;25;22" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="420.0" y="185.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#00e5ff" text-anchor="middle">rel54</text>
<text x="420.0" y="262.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="middle">good</text>
<circle cx="660" cy="220" r="22" fill="#0b1224" stroke="#ff2d95" stroke-width="4"><animate attributeName="r" values="22;25;22" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="660.0" y="185.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ff2d95" text-anchor="middle">rel55</text>
<text x="660.0" y="262.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="middle">bad release</text>
<circle cx="900" cy="220" r="22" fill="#0b1224" stroke="#39ff14" stroke-width="4"><animate attributeName="r" values="22;25;22" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="900.0" y="185.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#39ff14" text-anchor="middle">revert</text>
<text x="900.0" y="262.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="middle">git revert rel55</text>
<rect x="600" y="300" width="150" height="24" rx="12" fill="#ff2d95"/>
<text x="675.0" y="316.5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b1224" text-anchor="middle">cluster runs rel55</text>
<rect x="840" y="300" width="150" height="24" rx="12" fill="#39ff14"/>
<text x="915.0" y="316.5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b1224" text-anchor="middle">cluster runs rel54</text>
<path d="M 740 312 L 830 312" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="830,312 818.0,318.0 818.0,306.0" fill="#39ff14"/>
<text x="785.0" y="303.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#39ff14" text-anchor="middle">Argo CD syncs</text>
<rect x="40" y="350" width="340" height="100" rx="14" fill="#0b1224" stroke="#ff9f1c" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="40" y="350" width="340" height="34" rx="12" fill="#ff9f1c"/>
<text x="210.0" y="373.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">1 · Revert in Git</text>
<text x="52.0" y="406.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">git revert the bad tag commit</text>
<text x="52.0" y="425.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">PR → merge to main</text>
<rect x="430" y="350" width="340" height="100" rx="14" fill="#0b1224" stroke="#39ff14" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></rect>
<rect x="430" y="350" width="340" height="34" rx="12" fill="#39ff14"/>
<text x="600.0" y="373.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">2 · Argo CD notices</text>
<text x="442.0" y="406.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">desired tag goes back to rel54</text>
<rect x="820" y="350" width="340" height="100" rx="14" fill="#0b1224" stroke="#ff2d95" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite"/></rect>
<rect x="820" y="350" width="340" height="34" rx="12" fill="#ff2d95"/>
<text x="990.0" y="373.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">3 · Pods roll back</text>
<text x="832.0" y="406.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">rolling update to the old image</text>
<text x="832.0" y="425.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">rel54 already exists in ECR</text>
<path d="M 380 400 L 430 400" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="430,400 418.0,406.0 418.0,394.0" fill="#ff9f1c"/>
<circle r="5" fill="#ffffff" stroke="#ff9f1c" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 380 400 L 430 400"/></circle>
<path d="M 770 400 L 820 400" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="820,400 808.0,406.0 808.0,394.0" fill="#39ff14"/>
<circle r="5" fill="#ffffff" stroke="#39ff14" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 770 400 L 820 400"/></circle>
</svg>
