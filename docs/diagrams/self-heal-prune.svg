<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="100%" role="img" aria-label="Self-Heal and Prune">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="530" rx="22" fill="url(#bg)"/>
<text x="600.0" y="50.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#ttl)" text-anchor="middle">Self-Heal and Prune</text>
<text x="600.0" y="80.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">Argo CD keeps the cluster equal to Git, even when someone changes it by hand</text>
<rect x="40" y="150" width="300" height="200" rx="14" fill="#0b1224" stroke="#ff9f1c" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="40" y="150" width="300" height="34" rx="12" fill="#ff9f1c"/>
<text x="190.0" y="173.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Git (desired state)</text>
<text x="52.0" y="206.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">replicas: 2</text>
<text x="52.0" y="225.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">image tag: rel54</text>
<text x="52.0" y="244.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">config: envs/&lt;env&gt;/values.yaml</text>
<rect x="450" y="150" width="300" height="200" rx="14" fill="#0b1224" stroke="#39ff14" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="450" y="150" width="300" height="34" rx="12" fill="#39ff14"/>
<text x="600.0" y="173.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Argo CD compare</text>
<text x="462.0" y="206.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">checks every few minutes</text>
<text x="462.0" y="225.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">or on a Git webhook</text>
<text x="462.0" y="244.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">status: Synced / OutOfSync</text>
<rect x="860" y="150" width="300" height="200" rx="14" fill="#0b1224" stroke="#ff2d95" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></rect>
<rect x="860" y="150" width="300" height="34" rx="12" fill="#ff2d95"/>
<text x="1010.0" y="173.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Cluster (live state)</text>
<text x="872.0" y="206.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">replicas: 5  ← changed by hand</text>
<text x="872.0" y="225.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">a Service deleted by hand</text>
<path d="M 340 250 L 450 250" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="450,250 438.0,256.0 438.0,244.0" fill="#ff9f1c"/>
<circle r="5" fill="#ffffff" stroke="#ff9f1c" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 340 250 L 450 250"/></circle>
<text x="395.0" y="241.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ff9f1c" text-anchor="middle">desired</text>
<path d="M 750 250 L 860 250" fill="none" stroke="#ff2d95" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="860,250 848.0,256.0 848.0,244.0" fill="#ff2d95"/>
<circle r="5" fill="#ffffff" stroke="#ff2d95" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 750 250 L 860 250"/></circle>
<text x="805.0" y="241.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ff2d95" text-anchor="middle">live</text>
<rect x="40" y="390" width="540" height="110" rx="14" fill="#0b1224" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></rect>
<rect x="40" y="390" width="540" height="34" rx="12" fill="#00e5ff"/>
<text x="310.0" y="413.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">selfHeal: true</text>
<text x="52.0" y="446.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">a manual change is reverted to Git</text>
<text x="52.0" y="465.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">replicas go back to 2 automatically</text>
<rect x="620" y="390" width="540" height="110" rx="14" fill="#0b1224" stroke="#ffe600" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></rect>
<rect x="620" y="390" width="540" height="34" rx="12" fill="#ffe600"/>
<text x="890.0" y="413.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">prune: true</text>
<text x="632.0" y="446.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">a resource removed from Git</text>
<text x="632.0" y="465.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">is deleted from the cluster</text>
</svg>
