<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-label="GitOps Overview">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="470" rx="22" fill="url(#bg)"/>
<text x="600.0" y="50.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#ttl)" text-anchor="middle">GitOps Overview</text>
<text x="600.0" y="80.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">Git is the single source of truth · CI changes Git, Argo CD changes the cluster</text>
<rect x="30" y="170" width="200" height="150" rx="14" fill="#0b1224" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></rect>
<rect x="30" y="170" width="200" height="34" rx="12" fill="#00e5ff"/>
<text x="130.0" y="193.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Developer</text>
<text x="42.0" y="226.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">git push feature/*</text>
<text x="42.0" y="245.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">or merge to main</text>
<rect x="270" y="170" width="200" height="150" rx="14" fill="#0b1224" stroke="#ffe600" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="270" y="170" width="200" height="34" rx="12" fill="#ffe600"/>
<text x="370.0" y="193.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">CI · GitHub Actions</text>
<text x="282.0" y="226.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Build · test · scan</text>
<text x="282.0" y="245.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Docker image rel&lt;N&gt;</text>
<rect x="510" y="170" width="200" height="150" rx="14" fill="#0b1224" stroke="#ff9f1c" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></rect>
<rect x="510" y="170" width="200" height="34" rx="12" fill="#ff9f1c"/>
<text x="610.0" y="193.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Deployment repo</text>
<text x="522.0" y="226.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">envs/&lt;env&gt;/values.yaml</text>
<text x="522.0" y="245.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Helm chart (mychart)</text>
<rect x="750" y="170" width="200" height="150" rx="14" fill="#0b1224" stroke="#39ff14" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></rect>
<rect x="750" y="170" width="200" height="34" rx="12" fill="#39ff14"/>
<text x="850.0" y="193.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Argo CD</text>
<text x="762.0" y="226.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Watches Git</text>
<text x="762.0" y="245.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Syncs to the cluster</text>
<rect x="990" y="170" width="190" height="150" rx="14" fill="#0b1224" stroke="#ff2d95" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite"/></rect>
<rect x="990" y="170" width="190" height="34" rx="12" fill="#ff2d95"/>
<text x="1085.0" y="193.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Kubernetes</text>
<text x="1002.0" y="226.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Ledger pods</text>
<text x="1002.0" y="245.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Services · probes</text>
<path d="M 230 245 L 270 245" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="270,245 258.0,251.0 258.0,239.0" fill="#00e5ff"/>
<circle r="5" fill="#ffffff" stroke="#00e5ff" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 230 245 L 270 245"/></circle>
<path d="M 470 245 L 510 245" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="510,245 498.0,251.0 498.0,239.0" fill="#ffe600"/>
<circle r="5" fill="#ffffff" stroke="#ffe600" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 470 245 L 510 245"/></circle>
<path d="M 710 262 L 750 262" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="750,262 738.0,268.0 738.0,256.0" fill="#39ff14"/>
<circle r="5" fill="#ffffff" stroke="#39ff14" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 710 262 L 750 262"/></circle>
<path d="M 950 245 L 990 245" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="990,245 978.0,251.0 978.0,239.0" fill="#39ff14"/>
<circle r="5" fill="#ffffff" stroke="#39ff14" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 950 245 L 990 245"/></circle>
<rect x="270" y="340" width="200" height="90" rx="14" fill="#0b1224" stroke="#2979ff" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></rect>
<rect x="270" y="340" width="200" height="34" rx="12" fill="#2979ff"/>
<text x="370.0" y="363.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Amazon ECR</text>
<text x="282.0" y="396.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Stores rel&lt;N&gt; images</text>
<text x="282.0" y="415.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Scan on push</text>
<path d="M 370 320 L 370 340" fill="none" stroke="#2979ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="370,340 364.0,328.0 376.0,328.0" fill="#2979ff"/>
<circle r="5" fill="#ffffff" stroke="#2979ff" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 370 320 L 370 340"/></circle>
<path d="M 470 385 L 1085 385 L 1085 320" fill="none" stroke="#2979ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="1085,320 1091.0,332.0 1079.0,332.0" fill="#2979ff"/>
<circle r="5" fill="#ffffff" stroke="#2979ff" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 470 385 L 1085 385 L 1085 320"/></circle>
<text x="777.5" y="376.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2979ff" text-anchor="middle">pull image</text>
<text x="600.0" y="455.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ffe600" text-anchor="middle">CI never touches the cluster. It only changes Git; Argo CD pulls the change and applies it.</text>
</svg>
