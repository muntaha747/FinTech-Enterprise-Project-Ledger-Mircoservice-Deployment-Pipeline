<text x="342.0" y="215.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">sync: automatic</text>
<text x="342.0" y="234.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">tests: regression</text>
<rect x="350" y="350" width="190" height="24" rx="12" fill="#39ff14"/>
<text x="445.0" y="366.5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b1224" text-anchor="middle">auto-sync</text>
<path d="M 560 235 L 620 235" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="620,235 608.0,241.0 608.0,229.0" fill="#ffe600"/>
<circle r="5" fill="#ffffff" stroke="#ffe600" stroke-width="2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 560 235 L 620 235"/></circle>
