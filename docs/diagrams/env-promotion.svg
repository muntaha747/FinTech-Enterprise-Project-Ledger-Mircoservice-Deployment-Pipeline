<text x="632.0" y="196.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">trigger: regression passes</text>
<text x="632.0" y="215.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">sync: automatic</text>
<text x="632.0" y="234.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">tests: performance + load</text>
<rect x="640" y="350" width="190" height="24" rx="12" fill="#39ff14"/>
<text x="735.0" y="366.5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b1224" text-anchor="middle">auto-sync</text>
<path d="M 850 235 L 910 235" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="910,235 898.0,241.0 898.0,229.0" fill="#ff9f1c"/>
