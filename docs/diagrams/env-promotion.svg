<text x="1025.0" y="163.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">prod</text>
<text x="922.0" y="196.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">trigger: stage passes</text>
<text x="922.0" y="215.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">sync: manual approval</text>
<text x="922.0" y="234.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">tests: release</text>
<rect x="930" y="350" width="190" height="24" rx="12" fill="#ff2d95"/>
<text x="1025.0" y="366.5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b1224" text-anchor="middle">manual approval</text>
<text x="600.0" y="420.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ffe600" text-anchor="middle">Each stage starts only after the stage before it passes. Production is never automatic.</text>
<text x="600.0" y="455.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#00e5ff" text-anchor="middle">Repo folders today: functional · integration · regression · uat · release</text>
