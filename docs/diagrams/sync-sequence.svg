<text x="900.0" y="391.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2979ff" text-anchor="middle">5 rollout: new ReplicaSet and pods</text>
<path d="M 1010 450 L 790 450" fill="none" stroke="#ff2d95" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="790,450 802.0,444.0 802.0,456.0" fill="#ff2d95"/>
<circle r="5" fill="#ffffff" stroke="#ff2d95" stroke-width="2"><animateMotion dur="2.6s" repeatCount="indefinite" path="M 1010 450 L 790 450"/></circle>
<text x="900.0" y="441.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ff2d95" text-anchor="middle">6 readiness probe passes</text>
<path d="M 790 500 L 570 500" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="570,500 582.0,494.0 582.0,506.0" fill="#39ff14"/>
<circle r="5" fill="#ffffff" stroke="#39ff14" stroke-width="2"><animateMotion dur="2.6s" repeatCount="indefinite" path="M 790 500 L 570 500"/></circle>
<text x="680.0" y="491.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#39ff14" text-anchor="middle">7 status: Synced · Healthy</text>
<text x="585.0" y="303.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#39ff14" text-anchor="start">3 render Helm: chart + env values</text>
<text x="600.0" y="590.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ffe600" text-anchor="middle">Argo CD pulls from Git. Nothing in CI pushes to the cluster.</text>
</svg>
