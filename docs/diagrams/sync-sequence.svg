<path d="M 570 350 L 790 350" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="790,350 778.0,356.0 778.0,344.0" fill="#39ff14"/>
