<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img" aria-label="Deploy Sequence">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="640" rx="22" fill="url(#bg)"/>
<text x="600.0" y="50.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#ttl)" text-anchor="middle">Deploy Sequence</text>
<text x="600.0" y="80.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">From a new image tag in Git to a healthy rollout in the cluster</text>
<rect x="45" y="105" width="170" height="44" rx="12" fill="#00e5ff"/>
<text x="130.0" y="133.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1224" text-anchor="middle">CI (build repo)</text>
<line x1="130" y1="150" x2="130" y2="600" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="265" y="105" width="170" height="44" rx="12" fill="#ff9f1c"/>
<text x="350.0" y="133.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1224" text-anchor="middle">Deployment repo</text>
<line x1="350" y1="150" x2="350" y2="600" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="485" y="105" width="170" height="44" rx="12" fill="#39ff14"/>
<text x="570.0" y="133.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1224" text-anchor="middle">Argo CD</text>
<line x1="570" y1="150" x2="570" y2="600" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="705" y="105" width="170" height="44" rx="12" fill="#2979ff"/>
<text x="790.0" y="133.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1224" text-anchor="middle">Kubernetes API</text>
<line x1="790" y1="150" x2="790" y2="600" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="925" y="105" width="170" height="44" rx="12" fill="#ff2d95"/>
<text x="1010.0" y="133.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b1224" text-anchor="middle">Ledger pods</text>
<line x1="1010" y1="150" x2="1010" y2="600" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
<path d="M 130 200 L 350 200" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="350,200 338.0,206.0 338.0,194.0" fill="#00e5ff"/>
<circle r="5" fill="#ffffff" stroke="#00e5ff" stroke-width="2"><animateMotion dur="2.6s" repeatCount="indefinite" path="M 130 200 L 350 200"/></circle>
<text x="240.0" y="191.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#00e5ff" text-anchor="middle">1 commit new tag rel&lt;N&gt;</text>
<path d="M 350 250 L 570 250" fill="none" stroke="#ff9f1c" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
