<path d="M 790 400 L 1010 400" fill="none" stroke="#2979ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
<polygon points="1010,400 998.0,406.0 998.0,394.0" fill="#2979ff"/>
