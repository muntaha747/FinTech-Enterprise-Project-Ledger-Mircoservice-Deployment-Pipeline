<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" role="img" aria-label="Why GitOps and Argo CD">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="600" rx="22" fill="url(#bg)"/>
<text x="600.0" y="50.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#ttl)" text-anchor="middle">Why GitOps and Argo CD</text>
<text x="600.0" y="80.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">Six advantages of running deployments from Git</text>
<rect x="40" y="130" width="360" height="190" rx="14" fill="#0b1224" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></rect>
<rect x="40" y="130" width="360" height="34" rx="12" fill="#00e5ff"/>
<text x="220.0" y="153.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Git = source of truth</text>
<text x="52.0" y="186.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Everything the cluster runs is in Git</text>
<text x="52.0" y="205.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Changes go through pull requests</text>
<rect x="420" y="130" width="360" height="190" rx="14" fill="#0b1224" stroke="#ffe600" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.45s" repeatCount="indefinite"/></rect>
<rect x="420" y="130" width="360" height="34" rx="12" fill="#ffe600"/>
<text x="600.0" y="153.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Audit trail for free</text>
<text x="432.0" y="186.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Every change is a commit</text>
<text x="432.0" y="205.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Who, what, when and why</text>
<rect x="800" y="130" width="360" height="190" rx="14" fill="#0b1224" stroke="#ff9f1c" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></rect>
<rect x="800" y="130" width="360" height="34" rx="12" fill="#ff9f1c"/>
<text x="980.0" y="153.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Rollback = git revert</text>
<text x="812.0" y="186.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Undo a bad release in one commit</text>
<text x="812.0" y="205.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Argo CD applies the old state</text>
<rect x="40" y="345" width="360" height="190" rx="14" fill="#0b1224" stroke="#39ff14" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.95s" repeatCount="indefinite"/></rect>
<rect x="40" y="345" width="360" height="34" rx="12" fill="#39ff14"/>
<text x="220.0" y="368.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Self-healing</text>
<text x="52.0" y="401.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Manual drift is detected</text>
<text x="52.0" y="420.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">and reverted to the Git state</text>
<rect x="420" y="345" width="360" height="190" rx="14" fill="#0b1224" stroke="#ff2d95" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></rect>
<rect x="420" y="345" width="360" height="34" rx="12" fill="#ff2d95"/>
<text x="600.0" y="368.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Safer credentials</text>
<text x="432.0" y="401.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">CI pushes to Git only</text>
<text x="432.0" y="420.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">Argo CD pulls: no cluster keys in CI</text>
<rect x="800" y="345" width="360" height="190" rx="14" fill="#0b1224" stroke="#b388ff" stroke-width="3" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.45s" repeatCount="indefinite"/></rect>
<rect x="800" y="345" width="360" height="34" rx="12" fill="#b388ff"/>
<text x="980.0" y="368.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#0b1224" text-anchor="middle">Consistent environments</text>
<text x="812.0" y="401.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">One chart, many env values</text>
<text x="812.0" y="420.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">ApplicationSet adds envs from folders</text>
<text x="600.0" y="575.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ffe600" text-anchor="middle">Argo CD adds a live UI, health view, multi-cluster support, SSO and RBAC, and auto-sync or manual approval per app.</text>
</svg>
