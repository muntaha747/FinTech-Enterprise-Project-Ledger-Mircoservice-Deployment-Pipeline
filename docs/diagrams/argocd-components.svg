<text x="612.0" y="376.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">generates Applications</text>
<text x="612.0" y="395.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#f8fafc" text-anchor="start">from folders or lists</text>
<rect x="600" y="458" width="262" height="24" rx="12" fill="#b388ff"/>
<text x="731.0" y="474.5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b1224" text-anchor="middle">Redis · caches repo and app state</text>
