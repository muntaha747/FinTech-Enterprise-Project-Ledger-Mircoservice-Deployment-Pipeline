<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="100%" role="img" aria-label="Argo CD Components">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0845"/><stop offset="0.5" stop-color="#0b2a6f"/><stop offset="1" stop-color="#004d40"/></linearGradient>
<linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="0.5" stop-color="#ffe600"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="610" rx="22" fill="url(#bg)"/>
<text x="600.0" y="50.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#ttl)" text-anchor="middle">Argo CD Components</text>
<text x="600.0" y="80.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e0f2fe" text-anchor="middle">Inside the argocd namespace: the parts that read Git and drive the cluster</text>
<rect x="290" y="95" width="620" height="440" rx="22" fill="#ffffff" fill-opacity="0.04" stroke="#b388ff" stroke-width="3" stroke-dasharray="8 6"/>
<text x="310.0" y="125.0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#b388ff" text-anchor="start">argocd namespace</text>
